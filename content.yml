bio: |
  I am a Postdoctoral Fellow at the [American University of Sharjah](https://www.aus.edu/) (AUS), UAE, working with [Dr. Usman Tariq](https://www.aus.edu/node/58393), in collaboration with [Dr. Abhinav Dhall](https://sites.google.com/site/dhallabhinav), [Dr. Hasan Al-Nashash](https://www.aus.edu/node/58200) and [Dr. Jiyoung Park](https://bcs.kaist.ac.kr/sub020102/view/id/186).

  I completed my Ph.D. in Computer Science and Engineering at the Indian Institute of Technology (IIT) Indore as a Prime Minister's Research Fellow (PMRF), under the supervision of [Dr. Puneet Gupta](https://www.iiti.ac.in/people/~puneet/). My thesis, *"Exploring Trustworthy Multimodal Learning for Mental and Physiological Health Assessment"*, spans remote photoplethysmography (rPPG), affective computing and pain assessment. I then served as a Translational Research Fellow at IIT Indore, where I led the development of *SEHAT*, a smartphone-enabled remote heart-rate assessment and tracking app. I also work on adversarial attacks and defences for deep learning models.

  When I'm not deep into tech, I like to immerse myself in books, capture the night sky through astrophotography, or experiment in the kitchen. If you think we have something in common or wish to collaborate, please feel free to reach out!

interests:
  - Remote physiological sensing (rPPG)
  - Trustworthy multimodal learning
  - Affective computing & pain assessment
  - Adversarial robustness

